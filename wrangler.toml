name = "najdibot"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[[containers]]
class_name = "Downloader"
image = "./container/Dockerfile"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "DOWNLOADER"
class_name = "Downloader"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Downloader"]

[vars]
LLM_MODEL = "google/gemini-2.5-flash"

[[d1_databases]]
binding = "DB"
database_name = "najdibot"
database_id = "1ca1697d-9a02-4e72-88a4-190214746e8c"

# Сводка чата: 06:00 и 18:00 UTC (09:00 и 21:00 по Москве и Кипру)
[triggers]
crons = ["0 6,18 * * *"]
