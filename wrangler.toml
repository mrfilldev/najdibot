name = "najdibot"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[[containers]]
class_name = "Downloader"
image = "./container/Dockerfile"
max_instances = 1
instance_type = "basic"

[[durable_objects.bindings]]
name = "DOWNLOADER"
class_name = "Downloader"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Downloader"]
