  <circle cx="400" cy="325" r="40" fill="#0a5fa8" filter="url(#glow)" opacity="0.8"/>
  <circle cx="240" cy="325" r="30" fill="url(#eye)"/><circle cx="400" cy="325" r="30" fill="url(#eye)"/>
  <circle cx="232" cy="316" r="8" fill="#fff" opacity="0.9"/><circle cx="392" cy="316" r="8" fill="#fff" opacity="0.9"/>
